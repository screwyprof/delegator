name: Vulnerabilities

# Daily, because a vulnerability is usually disclosed after the code that's exposed to it shipped:
# no push happens, so the CI workflow never sees it. Also runnable by hand.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pins as ci.yml; Renovate keeps both up to date.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go the images ship with (ci.yml explains the pin). govulncheck judges the standard
          # library of the toolchain running it, so this must be the shipped one.
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: '**/go.sum'

      # Reachability-aware: it fails only for vulnerabilities on a call path from this code.
      - name: make vulns
        run: make vulns
