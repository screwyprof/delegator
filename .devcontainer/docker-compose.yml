services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  gopher-dev:
    # Uncomment if you want to override the service's Dockerfile to one in the .devcontainer 
    # folder. Note that the path of the Dockerfile and context is relative to the *primary* 
    # docker-compose.yml file (the first in the devcontainer.json "dockerComposeFile"
    # array). The sample below assumes your primary file is in the root of your project.
    #
    # build:
    #   context: .
    #   dockerfile: .devcontainer/Dockerfile
    # https://github.com/cachix/devenv/blob/main/containers/devcontainer/Dockerfile
    image: ghcr.io/cachix/devenv/devcontainer
    # init: true  # tini as PID 1 → reaps orphaned setup processes (no <defunct> zombie pileup)
    userns_mode: "keep-id"  # podman-only; no-op for docker+gVisor (rootful maps vscode:1000 -> dev:1000)
    # gopher-dev is its own container on the compose network, so "localhost" here means
    # gopher-dev itself, not the postgres container. Point every *_DATABASE_URL at the
    # "postgres" service name (resolvable via Compose DNS) so `go run`/`go test` work
    # unmodified inside the devcontainer, the same way the code's localhost defaults
    # work when running directly on the host (see ../env.demo and each service's config.go).
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATOR_DATABASE_URL: postgres://delegator:delegator@postgres:5432/delegator?sslmode=disable
      SCRAPER_DATABASE_URL: postgres://delegator:delegator@postgres:5432/delegator?sslmode=disable
      WEB_DATABASE_URL: postgres://delegator:delegator@postgres:5432/delegator?sslmode=disable
      TEST_DATABASE_URL: postgres://delegator:delegator@postgres:5432/delegator?sslmode=disable
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - .:/workspaces:cached
      #- ..:/workspaces:cached
      # Cache for nix packages
      - nix-store:/nix
      - direnv-data:/home/vscode/.local/share/direnv
    # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    # Overrides default command so things don't shut down after the process ends.
    #entrypoint: ["/nix-entrypoint.sh"]
    #command: sleep infinity
volumes:
  nix-store:
  direnv-data: